<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>読み取り内容確認画面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
            /* レシート画像が縦に長すぎる場合を考慮したスタイル */
            .receipt-image-container {
                max-height: 80vh;
                overflow-y: auto;
                text-align: center;
                background-color: #e9ecef;
                border-radius: 8px;
                padding: 10px;
            }
            .receipt-image-container img {
                max-width: 100%;
                height: auto;
            }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/top}">家計簿管理システム</a>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0">アップロード画像</h5>
                    </div>
                    <div class="card-body">
                        <div class="receipt-image-container">
                            <img th:if="${imageBase64 != null}" 
                                 th:src="@{'data:' + ${imageType} + ';base64,' + ${imageBase64}}" 
                                 alt="レシート画像" />
                            <p th:if="${imageBase64 == null}" class="text-muted">画像がありません</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">読み取り結果の確認・編集</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/receipt/save}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-bold">購入日時：</label>
                                <input type="text" class="form-control" name="date" th:value="${analyzedData.date}">
                                <input type="text" class="form-control" name="time" th:value="${analyzedData.time}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">購入店舗</label>
                                <input type="text" class="form-control" name="storeName" th:value="${analyzedData.merchant_name}">
                            </div>
                            
                            <div class="mb-3">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                            <th>No</th>
                                            <th>商品名</th>
                                            <th>価格 (円)</th>
                                        </tr>
                                    </thead>
                                    <tbody id="data-container">
                                        <tr th:each="item,stat : ${analyzedData.items}">
                                            <td th:text="${stat.count}"></td>
                                            <td>
                                                <input type="text" class="form-control" th:value="${item.name}">
                                            </td>
                                            <td>
                                                <input type="text" class="form-control" th:value="${item.price}">
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold">金額 (円)</label>
                                <input type="text" class="form-control" name="amount" th:value="${analyzedData.total_amount}">
                            </div>
                            
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/receipt/upload}" class="btn btn-outline-secondary me-md-2">キャンセル</a>
                                <button type="submit" class="btn btn-success px-5">この内容で登録</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
