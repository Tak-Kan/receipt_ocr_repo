<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>家計簿 編集</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        /* 画像をカード内に収めるためのスタイル */
        .receipt-image { max-width: 100%; height: auto; max-height: 80vh; object-fit: contain; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-pencil-square"></i> 編集・詳細確認</h2>
        <a th:href="@{/account/search}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-return-left"></i> 検索画面へ戻る
        </a>
    </div>

    <form th:action="@{/account/update}" th:object="${accountForm}" method="post">
        
        <input type="hidden" th:field="*{accountId}">
        <input type="hidden" th:field="*{receiptImagePath}">

        <div class="row g-4">
            
            <div class="col-lg-5">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white">
                        <h5 class="card-title mb-0 py-1">レシート画像</h5>
                    </div>
                    <div class="card-body text-center bg-light">
                        <img th:if="*{receiptImagePath != null}" th:src="@{*{receiptImagePath}}" alt="レシート画像" class="receipt-image border">
                        <div th:unless="*{receiptImagePath != null}" class="text-muted py-5">
                            <i class="bi bi-image fs-1"></i><br>画像がありません
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-white">
                        <h5 class="card-title mb-0 py-1">基本情報</h5>
                    </div>
                    <div class="card-body">
                        
                        <div class="mb-3">
                            <label for="storeName" class="form-label">店舗名</label>
                            <input type="text" class="form-control" id="storeName" th:field="*{storeName}">
                        </div>

                        <div class="mb-3 row">
                            <div class="col-md-6">
                                <label for="purchaseDatetime" class="form-label">購入日時</label>
                                <input type="datetime-local" class="form-control" id="purchaseDatetime" th:field="*{purchaseDatetime}">
                            </div>
                            <div class="col-md-6">
                                <label for="totalAmount" class="form-label">合計金額 (円)</label>
                                <input type="number" class="form-control" id="totalAmount" th:field="*{totalAmount}">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0 py-1">購入明細</h5>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col" class="ps-3" style="width: 5%;">#</th>
                                    <th scope="col" style="width: 45%;">商品名</th>
                                    <th scope="col" style="width: 25%;">金額</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="detail, stat : *{details}">
                                    <input type="hidden" th:field="*{details[__${stat.index}__].detailNumber}">
                                    
                                    <td class="ps-3 text-muted" th:text="${stat.count}">1</td>
                                    <td>
                                        <input type="text" class="form-control form-control-sm" th:field="*{details[__${stat.index}__].itemName}">
                                    </td>
                                    <td>
                                        <div class="input-group input-group-sm">
                                            <input type="number" class="form-control text-end" th:field="*{details[__${stat.index}__].itemAmount}">
                                            <span class="input-group-text">円</span>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-save"></i> 変更を保存する
                    </button>
                </div>

            </div>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
