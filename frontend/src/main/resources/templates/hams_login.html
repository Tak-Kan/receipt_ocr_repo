<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>ログイン画面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">家計簿管理システム</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">ログイン画面</h5>
                    </div>
                    <div class="card-body">
                        <!-- Spring Securityがエラー時に付与する "?error=true" を検知してメッセージ表示 -->
                        <div th:if="${param.error}" class="alert alert-danger mb-3" role="alert">
                            <i class="bi bi-exclamation-triangle"></i> ユーザーコードまたはパスワードが間違っています。
                        </div>

                        <!-- ログアウト時に付与される "?logout=true" を検知 -->
                        <div th:if="${param.logout}" class="alert alert-info mb-3" role="alert">
                            <i class="bi bi-info-circle"></i> ログアウトしました。
                        </div>

                        <form th:action="@{/login-process}" method="post">
                            <div class="mb-3">
                                <label for="userCode" class="form-label fw-bold">ユーザーID：</label>
                                <!-- name属性が最重要！SecurityConfigの usernameParameter と一致させます -->
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="userCode" name="userCode" 
                                        placeholder="例: 999999" required autofocus>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-bold">パスワード：</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" 
                                        placeholder="パスワード" required>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
                                    ログイン
                                </button>
                            </div>
                        </form>

                        <div>※パスワードを忘れた場合は、システム管理者へご連絡ください。</div>
                    </div>

                </div>
            </div>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
