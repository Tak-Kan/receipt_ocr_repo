<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>ログイン画面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">家計簿管理システム</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">ログイン画面</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${param.error}" class="error">Invalid username or password</div>
                        <div th:if="${param.logout}" style="color:green; margin-bottom:12px;">You have been logged out</div>

                        <form th:action="@{/login}" method="post" enctype="multipart/form-data">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <div class="mb-3">
                                <label for="username" class="form-label fw-bold">ユーザーID：</label>
                                <input type="text" class="form-control" id="username" name="username" autofocus>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-bold">パスワード：</label>
                                <input type="password" class="form-control" id="password" name="password">
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
                                    ログイン
                                </button>
                            </div>
                        </form>

                        <p style="margin-top:16px; color:#666;">
                          初期ユーザ: <strong>user</strong> / <strong>password</strong>
                        </p>

                        <div>ユーザーの新規作成は<a th:href="@{/register}">こちら</a></div>
                        <div>※パスワードを忘れた場合は、システム管理者へご連絡ください。</div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
