<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>レシート検索一覧（画面3）</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">経費精算システム</a>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-secondary text-white">
                <h5 class="mb-0">検索条件</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/receipt/search}" method="get" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">購入店舗</label>
                        <input type="text" class="form-control" name="storeName" th:value="${prevStoreName}" placeholder="店舗名を入力（部分一致）">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">日付</label>
                        <input type="date" class="form-control" name="date" th:value="${prevDate}">
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">検索</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">レシート一覧</h5>
                <a th:href="@{/receipt/upload}" class="btn btn-sm btn-success">新規読み取り(画面1へ)</a>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>日付</th>
                                <th>購入店舗</th>
                                <th>商品名</th>
                                <th>金額</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="receipt : ${receiptList}">
                                <td th:text="${receipt.id}">1</td>
                                <td th:text="${receipt.date}">2026-06-24</td>
                                <td th:text="${receipt.storeName}">サンプル店舗</td>
                                <td th:text="${receipt.itemName}">お茶など</td>
                                <td th:text="${#numbers.formatInteger(receipt.amount, 1, 'COMMA')} + ' 円'">1,000 円</td>
                                <td>
                                    <a th:href="@{/receipt/edit/{id}(id=${receipt.id})}" class="btn btn-sm btn-outline-primary">編集</a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(receiptList)}">
                                <td colspan="6" class="text-center text-muted py-4">該当するデータが見つかりません。</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
