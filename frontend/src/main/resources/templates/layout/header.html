<!-- src/main/resources/templates/layout/header.html -->
<!DOCTYPE html>
<!-- 💡 名前空間に sec を追加しておく必要があります -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- 💡 "navbar" という名前の部品（フラグメント）として定義します -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/top}"><i class="bi bi-wallet2 text-primary"></i> 家計簿システム</a>
        
        <!-- スマホ用ハンバーガーメニュー -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <!-- 左側のメインメニュー -->
            <ul class="navbar-nav me-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="hamsMenu" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-cash-coin"></i> 家計簿管理
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="hamsMenu">
                        <li><a class="dropdown-item" th:href="@{/receipt/upload}">画像取り込み</a></li>
                        <li><a class="dropdown-item" th:href="@{/account/search}">登録内容検索</a></li>
                    </ul>
                </li>
                
                <!-- 💡 マスタ管理（ドロップダウン）：管理者(ROLE_ADMIN)のみ表示 -->
                <li class="nav-item dropdown" sec:authorize="hasAuthority('ROLE_ADMIN')">
                    <a class="nav-link dropdown-toggle" href="#" id="masterMenu" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-gear"></i> マスタ管理
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="masterMenu">
                        <li><a class="dropdown-item" th:href="@{/admin/users}">ユーザー管理</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/roles}">ロール管理</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/accountCategorys}">費目マスタ管理</a></li>
                    </ul>
                </li>
            </ul>

            <!-- 右側のユーザー情報とログアウト -->
            <div class="d-flex align-items-center text-white" sec:authorize="isAuthenticated()">
                <span class="me-3">
                    <i class="bi bi-person-circle"></i>
                    <!-- 💡 ログイン中のユーザー名（username）を表示 -->
                    <span th:text="${#authentication.principal.user.userName}">ゲスト</span> さん
                </span>
                
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-light">ログアウト</button>
                </form>
            </div>
        </div>
    </div>
</nav>

</body>
</html>
