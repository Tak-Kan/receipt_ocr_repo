<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${accountForm.accountId == null} ? '読み取り内容確認画面' : '編集・詳細確認画面'">読み取り内容確認画面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
            /* レシート画像が縦に長すぎる場合を考慮したスタイル */
            .receipt-image-container {
                max-height: 80vh;
                overflow-y: auto;
                text-align: center;
                background-color: #e9ecef;
                border-radius: 8px;
                padding: 10px;
            }
            .receipt-image-container img {
                max-width: 100%;
                height: auto;
            }
            .form-group { margin-bottom: 15px; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/top}">
                <i class="bi bi-house-door text-primary"></i>家計簿管理システム
            </a>
            <div class="d-flex align-items-center text-white">
                <span class="me-3 d-none d-sm-inline" th:text="'ログイン中： ' + ${username}">ログイン: 鈴木 一郎 様</span>
                <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">ログアウト</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row">
            
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0">アップロード画像</h5>
                    </div>
                    <div class="card-body">
                        <div class="receipt-image-container">
                            <img th:src="@{${accountForm.receiptImagePath}}" alt="アップロードされたレシート" class="receipt-image"/>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">読み取り結果の確認・編集</h5>
                    </div>
                    <div class="card-body">
                        <form id="mainForm" th:action="@{/account/register}" th:object="${accountForm}" method="post">
                            <input type="hidden" th:field="*{accountId}" />
                            <input type="hidden" th:field="*{receiptImagePath}" />

                            <div class="form-group mb-3">
                                <label for="purchaseDatetime">購入日時：</label>
                                <input type="datetime-local" id="purchaseDatetime" th:field="*{purchaseDatetime}" />
                                <div th:if="${#fields.hasErrors('purchaseDatetime')}" th:errors="*{purchaseDatetime}" style="color: red;"></div>
                            </div>

                            <div class="form-group mb-3">
                                <label for="storeName">購入店舗：</label>
                                <input type="text" id="storeName" th:field="*{storeName}" style="width: 300px;" />
                                <div th:if="${#fields.hasErrors('storeName')}" th:errors="*{storeName}" style="color: red;"></div>
                            </div>

                            <div class="form-group mb-3">
                                <label for="invoiceNumber">事業者登録番号：</label>
                                <input type="text" id="invoiceNumber" th:field="*{invoiceNumber}" style="width: 300px;" />
                                <div th:if="${#fields.hasErrors('invoiceNumber')}" th:errors="*{invoiceNumber}" style="color: red;"></div>
                            </div>
                            
                            <div class="card shadow-sm">
                                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                                    <h5 class="card-title mb-0 py-1">購入明細</h5>
                                    <button type="button" class="btn btn-sm btn-outline-primary" id="addRowBtn">
                                        <i class="bi bi-plus-circle"></i> 行を追加
                                    </button>
                                </div>
                               <div class="card-body p-0">
                                    <table class="table table-hover align-middle mb-0" id="detailTable">
                                        <thead class="table-light">
                                            <tr>
                                                <th scope="col" class="ps-3" style="width: 5%;">#</th>
                                                <th scope="col" style="width: 45%;">商品名</th>
                                                <th scope="col" style="width: 25%;">金額</th>
                                                <th scope="col" style="width: 10%;" class="text-center">削除</th>
                                            </tr>
                                        </thead>
                                        <tbody id="detailTableBody">
                                            <tr th:each="detail, stat : *{details}" class="detail-row">
                                                <input type="hidden" th:field="*{details[__${stat.index}__].detailNumber}">
                                                
                                                <td class="ps-3 text-muted row-number" th:text="${stat.count}">1</td>
                                                <td>
                                                    <input type="text" class="form-control form-control-sm item-name" th:field="*{details[__${stat.index}__].itemName}">
                                                </td>
                                                <td>
                                                    <div class="input-group input-group-sm">
                                                        <input type="number" class="form-control text-end item-amount" th:field="*{details[__${stat.index}__].itemAmount}">
                                                        <span class="input-group-text">円</span>
                                                    </div>
                                                </td>
                                                <td class="text-center">
                                                    <button type="button" class="btn btn-sm btn-outline-danger delete-row-btn">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <div class="form-group mb-4">
                                <label for="totalAmount">合計金額 (円)：</label>
                                <input type="number" id="totalAmount" th:field="*{totalAmount}" />
                                <div th:if="${#fields.hasErrors('totalAmount')}" th:errors="*{totalAmount}" style="color: red;"></div>
                            </div>

                            <div class="form-group mb-3">
                                <label for="memo">備考：</label>
                                <input type="text" id="memo" th:field="*{memo}" style="width: 300px;" />
                                <div th:if="${#fields.hasErrors('memo')}" th:errors="*{memo}" style="color: red;"></div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="${accountForm.accountId == null} ? @{/receipt/upload} : @{/account/search}" class="btn btn-outline-secondary me-md-2">キャンセル</a>

                                <button th:if="${accountForm.accountId != null}" 
                                        type="submit" 
                                        class="btn btn-outline-danger btn-lg" 
                                        th:formaction="@{/account/delete}" 
                                        formnovalidate
                                        onclick="return confirm('この家計簿データを完全に削除しますか？');">
                                    <i class="bi bi-trash"></i> 削除する
                                </button>

                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-save"></i> 
                                    <span th:text="${accountForm.accountId == null} ? 'この内容で登録する' : '変更を保存する'"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    
    const tableBody = document.getElementById('detailTableBody');
    const addRowBtn = document.getElementById('addRowBtn');
    
    // フォーム全体を囲むformタグのIDを指定してください（例: <form id="accountForm" ...>）
    const form = document.querySelector('mainForm'); 

    // --- 1. インデックスの振り直し関数 ---
    // SpringがListとして受け取るために details[0], details[1] と連番にする必要があります
    function updateRowIndices() {
        const rows = tableBody.querySelectorAll('tr.detail-row');
        rows.forEach((row, index) => {
            // 行番号の見た目を更新
            row.querySelector('.row-number').textContent = index + 1;
            
            // name属性とid属性の details[X] を details[現在のindex] に書き換え
            row.querySelectorAll('input').forEach(input => {
                if (input.name) {
                    input.name = input.name.replace(/details\[\d+\]/, `details[${index}]`);
                }
                if (input.id) {
                    input.id = input.id.replace(/details\d+\./, `details${index}.`);
                }
            });
        });
    }

    // --- 2. 行追加処理 ---
    addRowBtn.addEventListener('click', function() {
        const rows = tableBody.querySelectorAll('tr.detail-row');
        // 最後の行をクローンする
        const lastRow = rows[rows.length - 1];
        const newRow = lastRow.cloneNode(true);
        
        // クローンした行の入力値をクリアする
        newRow.querySelectorAll('input').forEach(input => {
            input.value = ''; 
        });
        
        // テーブルの最後に追加してインデックスを振り直す
        tableBody.appendChild(newRow);
        updateRowIndices();
    });

    // --- 3. 行削除処理 (イベントデリゲーション) ---
    tableBody.addEventListener('click', function(e) {
        // クリックされたのが削除ボタン（またはその中のアイコン）の場合
        const deleteBtn = e.target.closest('.delete-row-btn');
        if (deleteBtn) {
            const rows = tableBody.querySelectorAll('tr.detail-row');
            if (rows.length > 1) {
                // 最低1行は残すようにして、対象の行を削除
                deleteBtn.closest('tr').remove();
                updateRowIndices();
            } else {
                alert('明細は最低1行必要です。');
            }
        }
    });

    // --- 4. 送信時の空行無視（フィルター）処理 ---
    form.addEventListener('submit', function(e) {
        const rows = tableBody.querySelectorAll('tr.detail-row');
        
        rows.forEach(row => {
            const itemName = row.querySelector('.item-name').value.trim();
            const amount = row.querySelector('.item-amount').value;
            
            // 商品名と金額が両方とも空欄の場合は、送信前にその行のHTMLを削除する
            // これによりSpring側のListには空行が渡らず、必須エラーにもなりません
            if (!itemName && !amount) {
                // ただし最後の1行だった場合は削除しない（必須エラーとして処理させるため）
                if (tableBody.querySelectorAll('tr.detail-row').length > 1) {
                    row.remove();
                }
            }
        });
        
        // 削除後にインデックスの歯抜けを防ぐため、最終の振り直しを実行
        updateRowIndices();
    });
});
</script>
</body>
</html>
