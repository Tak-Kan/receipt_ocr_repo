<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>読み取り内容確認画面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
            /* レシート画像が縦に長すぎる場合を考慮したスタイル */
            .receipt-image-container {
                max-height: 80vh;
                overflow-y: auto;
                text-align: center;
                background-color: #e9ecef;
                border-radius: 8px;
                padding: 10px;
            }
            .receipt-image-container img {
                max-width: 100%;
                height: auto;
            }
            .form-group { margin-bottom: 15px; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/top}">家計簿管理システム</a>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row">
            
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0">アップロード画像</h5>
                    </div>
                    <div class="card-body">
                        <div class="receipt-image-container">
                            <img th:src="@{${accountForm.receiptImagePath}}" alt="アップロードされたレシート" class="receipt-image"/>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">読み取り結果の確認・編集</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/account/register}" th:object="${accountForm}" method="post">
                            <input type="hidden" th:field="*{accountId}" />
                            <input type="hidden" th:field="*{receiptImagePath}" />

                            <div class="form-group mb-3">
                                <label for="purchaseDatetime">購入日時：</label>
                                <input type="datetime-local" id="purchaseDatetime" th:field="*{purchaseDatetime}" />
                                <div th:if="${#fields.hasErrors('purchaseDatetime')}" th:errors="*{purchaseDatetime}" style="color: red;"></div>
                            </div>

                            <div class="form-group mb-3">
                                <label for="storeName">購入店舗：</label>
                                <input type="text" id="storeName" th:field="*{storeName}" style="width: 300px;" />
                                <div th:if="${#fields.hasErrors('storeName')}" th:errors="*{storeName}" style="color: red;"></div>
                            </div>
                            
                            <div class="mb-3">
                                <h6>購入品リスト</h6>
                                <div th:if="${#fields.hasErrors('details')}" th:errors="*{details}" style="color: red;"></div>
                                <table>
                                    <thead>
                                        <tr>
                                            <th>No.</th>
                                            <th>商品名</th>
                                            <th>金額 (円)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="detail, stat : *{details}">
                                            <td th:text="${stat.count}">1</td>
                                            <td>
                                                <input type="text" th:field="*{details[__${stat.index}__].itemName}" style="width: 90%;" />
                                                <div th:if="${#fields.hasErrors('details[__${stat.index}__].itemName')}" th:errors="*{details[__${stat.index}__].itemName}" style="color: red;"></div>
                                            </td>
                                            <td>
                                                <input type="number" th:field="*{details[__${stat.index}__].itemAmount}" style="width: 90%;" />
                                                <div th:if="${#fields.hasErrors('details[__${stat.index}__].itemAmount')}" th:errors="*{details[__${stat.index}__].itemAmount}" style="color: red;"></div>
                                            </td>
                                        </tr>
                                        <tr th:if="${#lists.isEmpty(accountForm.details)}">
                                            <td colspan="3">商品データが読み取れませんでした。</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div class="form-group mb-4">
                                <label for="totalAmount">合計金額 (円)：</label>
                                <input type="number" id="totalAmount" th:field="*{totalAmount}" />
                                <div th:if="${#fields.hasErrors('totalAmount')}" th:errors="*{totalAmount}" style="color: red;"></div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/receipt/upload}" class="btn btn-outline-secondary me-md-2">キャンセル</a>
                                <button type="submit" class="btn btn-success px-5">この内容で登録</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
