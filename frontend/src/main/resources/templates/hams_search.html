<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登録情報検索画面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    
    <h2 class="mb-4"><i class="bi bi-search"></i> 家計簿検索</h2>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white">
            <h5 class="card-title mb-0 py-1">検索条件</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/account/search}" th:object="${searchForm}" method="get">
                <div class="row g-3 align-items-end">
                    
                    <div class="col-md-5">
                        <label class="form-label text-muted small mb-1">期間</label>
                        <div class="input-group">
                            <input type="date" class="form-control" th:field="*{startDate}">
                            <span class="input-group-text bg-white border-start-0 border-end-0">〜</span>
                            <input type="date" class="form-control" th:field="*{endDate}">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label for="keyword" class="form-label text-muted small mb-1">キーワード (店舗名・メモ)</label>
                        <input type="text" class="form-control" id="keyword" th:field="*{keyword}" placeholder="例: スーパー〇〇">
                    </div>

                    <div class="col-md-3">
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-search"></i> 検索
                            </button>
                            <a th:href="@{/account/search}" class="btn btn-outline-secondary px-4">
                                クリア
                            </a>
                        </div>
                    </div>
                    
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col" class="ps-4">ID</th>
                            <th scope="col">購入日時</th>
                            <th scope="col">店舗名</th>
                            <th scope="col" class="text-end">合計金額</th>
                            <th scope="col" class="text-center pe-4">アクション</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(accountList)}">
                            <td colspan="5" class="text-center text-muted py-4">
                                <i class="bi bi-info-circle"></i> 該当するデータがありません。
                            </td>
                        </tr>
                        
                        <tr th:each="account : ${accountList}">
                            <td class="ps-4 text-muted" th:text="${account.accountId}">1</td>
                            <td th:text="${#temporals.format(account.purchaseDatetime, 'yyyy/MM/dd HH:mm')}">2026/07/06 21:30</td>
                            <td th:text="${account.storeName}">スーパー〇〇</td>
                            <td class="text-end fw-bold" th:text="${#numbers.formatInteger(account.totalAmount, 1, 'COMMA')} + ' 円'">1,000 円</td>
                            <td class="text-center pe-4">
                                <a th:href="@{/account/detail/{id}(id=${account.accountId})}" class="btn btn-sm btn-outline-info">
                                    詳細
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white text-muted small text-end" th:if="${not #lists.isEmpty(accountList)}">
            <span th:text="${#lists.size(accountList)} + ' 件のデータ'"></span>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
