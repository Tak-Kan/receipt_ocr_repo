<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <title>Top Page</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    .header { display:flex; justify-content:space-between; align-items:center; }
    .container { max-width: 800px; margin:auto; }
    button.disabled-btn {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>家計簿管理システム</h2>
      <div>
        <span th:text="'ユーザーID： ' + ${username}">Hello, user!</span>
        &nbsp;|&nbsp;
        <a th:href="@{/logout}">ログアウト</a>
      </div>
    </div>

    <hr/>
    
    <!-- 画像取込ボタン（クリックで /image/entry へ） -->
    <button type="button" th:onclick="|location.href='@{/image/upload}'|">
      画像取込
    </button>

    <form th:action="@{/login}" method="post">
      <button type="submit" disabled>登録内容検索</button>
    </form>

    <div class="admin-area">
      <!-- 管理者は有効なボタン（クリックで /admin/users へ） -->
      <button type="button"
              sec:authorize="hasRole('ADMIN')"
              th:onclick="|location.href='@{/admin/users}'|">
        ユーザー情報管理
      </button>

      <!-- 非管理者は表示はするが無効 -->
      <button type="button"
              sec:authorize="!hasRole('ADMIN')"
              disabled
              class="disabled-btn">
        ユーザー情報管理
      </button>
    </div>
    <hr/>
    
    <!-- テストページボタン（クリックで /testPage へ） -->
    <button type="button" th:onclick="|location.href='@{/testPage}'|">
      テストページ
    </button>

    <p>Welcome to the top page. This page is protected by Spring Security (DB authentication).</p>
  </div>
</body>
</html>
