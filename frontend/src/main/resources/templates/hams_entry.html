<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>画像取込画面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/top}">
                <i class="bi bi-house-door text-primary"></i>家計簿管理システム
            </a>
            <div class="d-flex align-items-center text-white">
                <span class="me-3 d-none d-sm-inline" th:text="'ログイン中： ' + ${username}">ログイン: 鈴木 一郎 様</span>
                <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">ログアウト</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">画像取込画面</h5>
                        <h7 class="mb-0">画像ファイル選択後、読み取りを実行してください。</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${param.error}" class="alert alert-danger" role="alert">
                            画像の解析に失敗しました。別の画像をお試しください。
                        </div>
                        <div th:if="${param.success}" class="alert alert-success" role="alert">
                            レシートデータの登録が完了しました。
                        </div>
                        
                        <form th:action="@{/account/read}" method="post" enctype="multipart/form-data" id="uploadForm">
                            <div class="mb-4">
                                <label for="receiptFile" class="form-label">画像ファイルを選択してください (JPEG/PNG)</label>
                                <input class="form-control" type="file" id="receiptFile" name="file" accept="image/*" required>
                            </div>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
                                    読み取りを実行
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', function() {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; // ボタンを無効化
            // Bootstrapのスピナーを表示
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 解析中...';
        });
    </script>
</body>
</html>
