<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <title>Image_Import</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .header { display:flex; justify-content:space-between; align-items:center; }
    .container { max-width: 720px; margin:auto; }
    .preview { margin-top: 12px; }
    img.preview-img { max-width: 100%; max-height: 360px; border:1px solid #ddd; padding:4px; }
    .meta { margin-top:8px; color:#333; }
    .error { color: #b00020; }
    .ok { color: #2e7d32; }
  </style>
</head>
<body>
  <div class="container">
    <div class="banner">
      <img src="@{/images/logo.jpg}" alt="ロゴ" width="193" height="130">
    </div>
    
    <h2 style="text-align:center">家計簿管理システム</h2>

    <div class="header">
      <h2>画像取込画面</h2>
      <div>
        <span th:text="'ユーザーID： ' + ${username}">Hello, user!</span>
        &nbsp;|&nbsp;
        <a th:href="@{/logout}">ログアウト</a>
      </div>
    </div>

    <div th:if="${error}" class="error" th:text="${error}"></div>
    <div th:if="${success}" class="ok" th:text="${success}"></div>

    <form th:action="@{/image/upload}" method="post" enctype="multipart/form-data">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <label for="file">ファイルパス：</label><br/>
      <input id="file" name="file" type="file" accept="image/*" />


      <div class="preview" id="preview-area" style="display:none;">
        <p>プレビュー:</p>
        <img id="preview-img" class="preview-img" src="#" alt="preview"/>
      </div>

      <button type="submit" style="margin-top:12px;">登録</button>
      <button type="button" th:onclick="|location.href='@{/top}'|">戻る</button>
    </form>

    <div th:if="${uploadedId}">
      <h3>アップロード結果</h3>
      <p>ID: <span th:text="${uploadedId}"></span></p>
      <p>プレビュー（DB から取得）:</p>
      <img th:src="@{|/admin/images/${uploadedId}|}" alt="uploaded" style="max-width:400px; border:1px solid #ddd; padding:4px;"/>
    </div>
  </div>
  <script>
    const fileInput = document.getElementById('file');
    const filenameSpan = document.getElementById('filename');
    const filepathSpan = document.getElementById('filepath');
    const previewArea = document.getElementById('preview-area');
    const previewImg = document.getElementById('preview-img');

    fileInput.addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) {
        filenameSpan.textContent = '（未選択）';
        filepathSpan.textContent = '（取得不可）';
        previewArea.style.display = 'none';
        previewImg.src = '#';
        return;
      }
      // filename
      filenameSpan.textContent = f.name + ' (' + f.type + ', ' + f.size + ' bytes)';

      // input.value の中には多くのブラウザで "C:\fakepath\..." が入りますが
      // 真のフルパスはブラウザで取得できません（セキュリティ制限）。
      filepathSpan.textContent = fileInput.value || '（取得不可）';

      // プレビュー（FileReader）
      const reader = new FileReader();
      reader.onload = function(evt) {
        previewImg.src = evt.target.result;
        previewArea.style.display = 'block';
      };
      reader.readAsDataURL(f);
    });
  </script>
</body>
</html>
