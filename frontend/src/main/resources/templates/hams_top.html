<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>トップページ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* メニューカードを押しやすくするためのホバーエフェクト */
        .menu-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none; /* リンクの下線を消す */
            color: inherit;
            display: block; /* aタグ全体をブロック要素にする */
        }
        /* マウスオーバー時に少し浮き上がるような視覚効果 */
        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
            color: inherit;
        }
        .card-icon {
            font-size: 3rem; /* アイコン（絵文字）のサイズ */
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/top}">
                <i class="bi bi-house-door text-primary"></i>家計簿管理システム
            </a>
            <div class="d-flex align-items-center text-white">
                <span class="me-3 d-none d-sm-inline" th:text="'ログイン中： ' + ${username}">ログイン: 鈴木 一郎 様</span>
                <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">ログアウト</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-5">
            <div class="col-12 text-center">
                <h2 class="fw-bold">ダッシュボード</h2>
                <p class="text-muted">ご希望の業務メニューを選択してください。</p>
            </div>
        </div>
        <div class="row g-4 justify-content-center">
            <!-- 画像取込ボタン（クリックで /receipt/entry へ） -->
            <div class="col-12 col-md-6 col-lg-5">
                <a th:href="@{/receipt/upload}" class="card h-100 shadow-sm menu-card text-center p-4 border-0 rounded-3">
                    <div class="card-body">
                        <div class="card-icon">📊</div>
                        <h4 class="card-title fw-bold text-dark">画像取込</h4>
                        <p class="card-text text-muted mt-2">レシート画像の取込・登録・確認を行います。</p>
                    </div>
                </a>
            </div>

            <!-- 画像取込ボタン（クリックで /image/entry へ） -->
            <div class="col-12 col-md-6 col-lg-5">
                <a th:href="@{/account/search}" class="card h-100 shadow-sm menu-card text-center p-4 border-0 rounded-3" disabled>
                    <div class="card-body">
                        <div class="card-icon">🔍</div>
                        <h4 class="card-title fw-bold text-dark">登録内容検索</h4>
                        <p class="card-text text-muted mt-2">登録済みの情報を検索・表示します。</p>
                    </div>
                </a>
            </div>

            <!-- 管理者は有効なボタン（クリックで /admin/users へ） -->
            <div class="col-12 col-md-6 col-lg-5" sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/users}" class="card h-100 shadow-sm menu-card text-center p-4 border-0 rounded-3">
                    <div class="card-body">
                        <div class="card-icon">⚙️</div>
                        <h4 class="card-title fw-bold text-dark">ユーザー情報管理</h4>
                        <p class="card-text text-muted mt-2">ユーザー管理を行います。</p>
                    </div>
                </a>
            </div>

            <!-- 非管理者は表示はするが無効 -->
            <div class="col-12 col-md-6 col-lg-5" sec:authorize="!hasRole('ADMIN')">
                <div class="card h-100 shadow-none text-center p-4 border-0 rounded-3 bg-secondary bg-opacity-10 opacity-50 pe-none" style="cursor: not-allowed;">
                    <div class="card-body">
                        <div class="card-icon">⚙️</div>
                        <h4 class="card-title fw-bold text-secondary">ユーザー情報管理</h4>
                        <p class="card-text text-muted mt-2">ユーザー管理を行います。<br><strong class="text-danger small">※管理者権限が必要です</strong></p>
                    </div>
                </div>
            </div>

            <!-- テストページボタン（クリックで /testPage へ） -->
            <div class="col-12 col-md-6 col-lg-5">
                <a th:href="@{/testPage}" class="card h-100 shadow-sm menu-card text-center p-4 border-0 rounded-3">
                    <div class="card-body">
                        <div class="card-icon">🐞</div>
                        <h4 class="card-title fw-bold text-dark">テストページ</h4>
                        <p class="card-text text-muted mt-2">開発用テストページ</p>
                    </div>
                </a>
            </div>
            <p>Welcome to the top page. This page is protected by Spring Security (DB authentication).</p>

        </div>
    </div>
</body>
</html>
