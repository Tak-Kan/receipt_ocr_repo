<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Register</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    .container { max-width: 360px; margin: auto; }
    .error { color: red; margin-bottom: 12px; }
    label { display:block; margin-top:8px; }
    input[type="text"], input[type="password"] { width:100%; padding:8px; margin-top:4px; box-sizing:border-box; }
    button { margin-top:12px; padding:8px 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Register</h2>
    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autofocus />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" />

      <label for="password2">Confirm Password</label>
      <input id="password2" name="password2" type="password" />

      <button type="submit">Register</button>
    </form>

    <p style="margin-top:16px; color:#666;">
      After registration you'll be redirected to the login page.
    </p>
  </div>
</body>
</html>
