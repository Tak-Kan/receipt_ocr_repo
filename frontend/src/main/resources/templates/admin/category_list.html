<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>費目マスタ管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav th:replace="~{layout/header :: navbar}"></nav>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-shield-lock"></i> 費目マスタ管理</h2>
        <div>
            <a th:href="@{/admin/accountCategorys/new}" class="btn btn-primary me-2"><i class="bi bi-plus-circle"></i> 新規追加</a>
            <a th:href="@{/top}" class="btn btn-outline-secondary">トップへ戻る</a>
        </div>
    </div>

    <!-- 削除エラー時のメッセージ表示 -->
    <div th:if="${errorMessage}" class="alert alert-danger" accountCategory="alert" th:text="${errorMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-3">ID</th>
                        <th>費目名</th>
                        <th class="text-center">備考</th>
                        <th class="text-center">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="accountCategory : ${accountCategorys}">
                        <td class="ps-3 text-muted" th:text="${accountCategory.categoryId}">1</td>
                        <td class="fw-bold" th:text="${accountCategory.categoryName}">食費</td>
                        <td class="fw-bold" th:text="${accountCategory.memo}">備考</td>
                        <td class="text-center">
                            <div class="d-flex justify-content-center gap-2">
                                <a th:href="@{/admin/accountCategorys/{id}/edit(id=${accountCategory.categoryId})}" class="btn btn-sm btn-outline-primary">編集</a>
                                <!-- IDが1(管理者)の場合は削除ボタンを非表示にする制御 -->
                                <form th:if="${accountCategory.categoryId != 1}" th:action="@{/admin/accountCategorys/{id}/delete(id=${accountCategory.categoryId})}" method="post" onsubmit="return confirm('本当に削除しますか？');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">削除</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
