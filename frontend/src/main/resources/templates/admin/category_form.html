<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${accountCategoryForm.isNew} ? '費目マスタ新規追加' : '費目マスタ編集'">費目マスタ登録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav th:replace="~{layout/header :: navbar}"></nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0" th:text="${accountCategoryForm.isNew} ? '費目マスタ新規追加' : '費目マスタ編集'"></h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/accountCategorys/save}" th:object="${accountCategoryForm}" method="post">
                        
                        <input type="hidden" th:field="*{new}" />
                        <input type="hidden" th:field="*{categoryId}" />

                        <div class="mb-3">
                            <label class="form-label fw-bold">費目名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{categoryName}" 
                                   th:classappend="${#fields.hasErrors('categoryName')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryName')}" th:errors="*{categoryName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">備考 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{memo}" 
                                   th:classappend="${#fields.hasErrors('memo')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('memo')}" th:errors="*{memo}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/admin/accountCategorys}" class="btn btn-secondary">キャンセル</a>
                            <button type="submit" class="btn btn-primary px-4">保存</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
