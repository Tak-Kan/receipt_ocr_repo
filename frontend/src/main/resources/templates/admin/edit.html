<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Edit User</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    label { display:block; margin-top:8px; }
    input[type="text"] { width:100%; padding:8px; margin-top:4px; box-sizing:border-box; }
    button { margin-top:12px; padding:6px 10px; }
    .roles { margin-top:8px; }
  </style>
</head>
<body>
  <h2>Edit User</h2>
  <p><a th:href="@{/admin/users}">Back to users</a></p>

  <form th:action="@{|/admin/users/${user.id}/edit|}" method="post" th:object="${user}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <label>Username</label>
    <input type="text" th:value="${user.username}" readonly />

    <div class="roles">
      <label>Roles</label>
      <div th:each="r : ${allRoles}">
        <label>
          <input type="checkbox" name="roles" th:value="${r.id}"
                 th:checked="${assignedRoleIds.contains(r.id)}" />
          <span th:text="${r.name}">ROLE</span>
        </label>
      </div>
    </div>

    <label><input type="checkbox" name="enabled" th:checked="${user.enabled}"/> Enabled</label>

    <button type="submit">Save</button>
  </form>
</body>
</html>
