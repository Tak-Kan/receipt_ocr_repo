<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理情報画面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people"></i> ユーザー管理 (管理者専用)</h2>
        <a th:href="@{/}" class="btn btn-outline-secondary">トップへ戻る</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th scope="col" class="ps-3">ID</th>
                        <th scope="col">ユーザー名</th>
                        <th scope="col">メールアドレス</th>
                        <th scope="col">権限</th>
                        <th scope="col">登録日</th>
                        <th scope="col" class="text-center">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td class="ps-3 text-muted" th:text="${user.userId}">1</td>
                        <td class="fw-bold" th:text="${user.username}">山田 太郎</td>
                        <td th:text="${user.email}">user@example.com</td>
                        <td>
                            <!-- 管理者ならバッジを赤色、一般なら青色に -->
                            <span class="badge" 
                                  th:classappend="${user.role == 'ROLE_ADMIN'} ? 'bg-danger' : 'bg-primary'"
                                  th:text="${user.role == 'ROLE_ADMIN'} ? '管理者' : '一般'">管理者</span>
                        </td>
                        <td th:text="${#temporals.format(user.createdAt, 'yyyy/MM/dd')}">2026/07/01</td>
                        <td class="text-center">
                            <!-- 編集・削除ボタンなどの拡張用 -->
                            <button class="btn btn-sm btn-outline-primary">詳細</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
