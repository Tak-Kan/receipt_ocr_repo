<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザー管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people"></i> ユーザー管理</h2>
        <div>
            <!-- 💡 新規登録画面へのリンク -->
            <a th:href="@{/admin/users/new}" class="btn btn-primary me-2"><i class="bi bi-plus-circle"></i> 新規登録</a>
            <a th:href="@{/top}" class="btn btn-outline-secondary">トップへ戻る</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-3">ユーザーコード</th>
                        <th>ユーザー名</th>
                        <th>権限</th>
                        <th>登録日</th>
                        <th class="text-center">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td class="ps-3 text-muted fw-bold" th:text="${user.userCode}">999999</td>
                        <td th:text="${user.userName}">管理者</td>
                        <td>
                            <span class="badge" th:classappend="${user.role.roleId == 1} ? 'bg-danger' : 'bg-primary'"
                                  th:text="${user.role.roleName}">管理者</span>
                        </td>
                        <td th:text="${#temporals.format(user.entryDatetime, 'yyyy/MM/dd')}">2026/01/01</td>
                        <td class="text-center">
                            <div class="d-flex justify-content-center gap-2">
                                <!-- 編集ボタン -->
                                <a th:href="@{/admin/users/{id}/edit(id=${user.userCode})}" class="btn btn-sm btn-outline-primary">編集</a>
                                
                                <!-- 削除ボタン（フォームでPOST送信） -->
                                <form th:action="@{/admin/users/{id}/delete(id=${user.userCode})}" method="post" 
                                      onsubmit="return confirm('本当に削除しますか？');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">削除</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
