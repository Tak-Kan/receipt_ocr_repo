<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${userForm.isNew} ? 'ユーザー新規登録' : 'ユーザー編集'">ユーザー登録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0" th:text="${userForm.isNew} ? 'ユーザー新規登録' : 'ユーザー編集'"></h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/users/save}" th:object="${userForm}" method="post">
                        
                        <!-- isNewフラグを隠しパラメータとして送信 -->
                        <input type="hidden" th:field="*{new}" />

                        <div class="mb-3">
                            <label class="form-label fw-bold">ユーザーコード (6桁) <span class="text-danger">*</span></label>
                            <!-- 💡 更新時は readonly にして編集不可にする -->
                            <input type="text" class="form-control" th:field="*{userCode}" 
                                   th:readonly="${!userForm.isNew}" 
                                   th:classappend="${#fields.hasErrors('userCode')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('userCode')}" th:errors="*{userCode}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">ユーザー名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{userName}" 
                                   th:classappend="${#fields.hasErrors('userName')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">パスワード <span th:if="${userForm.isNew}" class="text-danger">*</span></label>
                            <input type="password" class="form-control" th:field="*{password}"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                   th:placeholder="${!userForm.isNew} ? '変更する場合のみ入力してください' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">権限 <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{roleId}" th:classappend="${#fields.hasErrors('roleId')} ? 'is-invalid'">
                                <option value="">選択してください</option>
                                <option th:each="role : ${roles}" 
                                        th:value="${role.roleId}" 
                                        th:text="${role.roleName}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('roleId')}" th:errors="*{roleId}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/admin/users}" class="btn btn-secondary">キャンセル</a>
                            <button type="submit" class="btn btn-primary px-4">保存</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
