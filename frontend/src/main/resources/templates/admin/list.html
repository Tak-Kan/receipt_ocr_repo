<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Admin - Users</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .header { display:flex; justify-content:space-between; align-items:center; }
    table { width:100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background:#f4f4f4; }
    .actions form { display:inline; }
  </style>
</head>
<body>
  <div class="banner">
    <img src="@{/images/logo.jpg}" alt="ロゴ" width="193" height="130">
  </div>
    
  <h2>家計簿管理システム</h2>

  <div class="header">
    <h2>ユーザー管理画面</h2>
    <div>
      <p>
        <a th:href="@{/top}">Back to Top</a> |
        <a th:href="@{/admin/roles}">Manage Roles</a> |
        <a th:href="@{/logout}">Logout</a>
      </p>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th><th>ユーザー名</th><th>権限</th><th>有効</th><th>操作</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="u : ${users}">
        <td th:text="${u.id}">1</td>
        <td th:text="${u.username}">user</td>
        <td>
          <span th:each="r, stat : ${u.roles}">
            <span th:text="${r.name}">ROLE</span><span th:if="${!stat.last}">, </span>
          </span>
        </td>
        <td th:text="${u.enabled}">true</td>
        <td class="actions">
          <a th:href="@{|/admin/users/${u.id}/edit|}">Edit</a>
          <form th:action="@{|/admin/users/${u.id}/delete|}" method="post" th:object="${u}" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" onclick="return confirm('Delete this user?')">Delete</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
