<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${roleForm.isNew} ? 'ロール新規追加' : 'ロール編集'">ロール登録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0" th:text="${roleForm.isNew} ? 'ロール新規追加' : 'ロール編集'"></h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/roles/save}" th:object="${roleForm}" method="post">
                        
                        <input type="hidden" th:field="*{new}" />
                        <input type="hidden" th:field="*{roleId}" />

                        <!-- Service側で弾かれたエラー（ID:1の権限剥奪など）の表示エリア -->
                        <div th:if="${#fields.hasErrors('authEntryFlag')}" class="alert alert-danger" th:errors="*{authEntryFlag}"></div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">ロール名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{roleName}" 
                                   th:classappend="${#fields.hasErrors('roleName')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('roleName')}" th:errors="*{roleName}"></div>
                        </div>

                        <div class="mb-3 form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" th:field="*{authEntryFlag}">
                            <label class="form-check-label fw-bold">データ登録権限を付与する</label>
                        </div>

                        <div class="mb-4 form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" th:field="*{authDeleteFlag}">
                            <label class="form-check-label fw-bold">データ削除権限を付与する</label>
                            <div class="form-text text-muted">※管理者以外に削除権限を付与する場合は慎重に行ってください。</div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/admin/roles}" class="btn btn-secondary">キャンセル</a>
                            <button type="submit" class="btn btn-primary px-4">保存</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
