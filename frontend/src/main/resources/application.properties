# DataSource: environment variables override these; e.g. SPRING_DATASOURCE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://db:3306/sampledb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:appuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:apppass}

# JPA: create/update tables automatically for this sample
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# @Tableや@Columnで指定した名前をそのまま（大文字小文字も含めて）使う設定
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# 既存設定に追加/上書き
# 最大アップロードサイズ（必要に応じて調整）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Thymeleaf dev
spring.thymeleaf.cache=false

# サーバポート
server.port=8080

# NASを使うとき（デフォルト）
# storage.type=local
# AzureBlobStrage
# storage.type=cloud
# AWS S3
storage.type=aws

logging.level.org.springframework.security=TRACE