version: "3.9"

services:
  backend:
    build: ./backend
    container_name: flask_backend
    ports:
      - "5000:5000"
    # command: /bin/sh -c "while sleep 1000; do :; done"

  frontend:
    build: ./frontend
    container_name: spring_frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
