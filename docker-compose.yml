version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sample-backend
    restart: unless-stopped
    environment:
      - DB_HOST=192.168.11.26
      - DB_PORT=3307
      - DB_NAME=python_schema
      - DB_USER=testuser
      - DB_PASS=testP@ssw0rd
    ports:
      - "5000:5000"
    networks:
      - sample-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sample-frontend
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://192.168.11.26:3307/python_schema
      - SPRING_DATASOURCE_USERNAME=testuser
      - SPRING_DATASOURCE_PASSWORD=testP@ssw0rd
    ports:
      - "8080:8080"
    networks:
      - sample-network

volumes:
  db-data:

networks:
  sample-network:
    driver: bridge