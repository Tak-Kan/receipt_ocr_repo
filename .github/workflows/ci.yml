name: CI

# テストとビルドの確認だけを行います（デプロイはしません）。
#  - プルリクエスト（ベースブランチは問いません）
#  - main / feature/aws-support への push
#  - Actions画面からの手動実行
on:
  pull_request:
  push:
    branches:
      - main
      - feature/aws-support
  workflow_dispatch:

# ジョブに付与する権限は、リポジトリの読み取りだけにする
permissions:
  contents: read

# 同じブランチで続けて push したら、古い実行は取り消す
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # フロントエンド（Spring Boot）：テストとパッケージ作成
  # ------------------------------------------------------------
  frontend:
    name: Frontend (Spring Boot) - test and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"   # pom.xml の java.version と合わせる
          cache: maven

      # テスト（src/test）を実行して、jarを作る
      - name: mvn verify
        working-directory: frontend
        run: mvn -B -ntp verify

  # ------------------------------------------------------------
  # バックエンド（Flask）：依存関係の解決と、起動できるかの確認
  # ------------------------------------------------------------
  backend:
    name: Backend (Flask) - install and import check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # backend/Dockerfile のベースイメージと合わせる
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q .

      # Azureの認証情報がなくても、アプリを読み込める（起動時に落ちない）ことを確認する
      - name: Import smoke test
        run: python -c "import app"

  # ------------------------------------------------------------
  # Dockerイメージが、まっさらな環境でビルドできるかの確認（pushはしない）
  # ------------------------------------------------------------
  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          load: true            # 次のステップで中身を確認できるよう、ローカルに読み込む
          push: false
          tags: receipt-ocr-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # RDSのCA証明書バンドルに含まれる証明書が、すべてJavaのTrustStoreに登録されていることを確認する
      # （keytool -importcert は先頭の1枚しか登録しないため、Dockerfileで1枚ずつ登録している）
      - name: Verify RDS CA bundle is fully trusted
        if: matrix.service == 'frontend'
        run: |
          expected=$(grep -c 'BEGIN CERTIFICATE' frontend/ap-northeast-3-bundle.pem)
          imported=$(docker run --rm --entrypoint keytool receipt-ocr-frontend:ci \
            -list -cacerts -storepass changeit | grep -c '^ap-northeast-3-bundle-' || true)
          echo "certificates in bundle: ${expected}, imported into truststore: ${imported}"
          test "${expected}" -gt 0
          test "${imported}" -eq "${expected}"
